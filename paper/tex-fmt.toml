# Formatting for `make fmt`, which runs tex-fmt, then texfill.py to refill
# prose paragraphs to the same width, then tex-fmt again.
#
# Hard wrap at 80 columns. Refilling reflows whole paragraphs, so a one-word
# change can show up as several changed lines in a diff -- run `make fmt` as
# its own commit rather than mixing it with content edits, and the history
# stays readable.
wrap = true
wraplen = 80
tabsize = 2
usetabs = false
